$kind: http-request
url: "{{testUrl}}/educators"
method: POST
body:
  type: json
  content: |-
    {
        "firstName" : "Educator1",
        "lastName" : "Lorem"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", () => pm.response.to.have.status(201));

      pm.collectionVariables.set("educatorId", pm.response.json().id);
    language: text/javascript
order: 2000
