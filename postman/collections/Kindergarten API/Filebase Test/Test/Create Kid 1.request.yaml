$kind: http-request
url: "{{testUrl}}/kids"
method: POST
body:
  type: json
  content: |-
    {
        "firstName" : "Kid1",
        "lastName" : "KL1",
        "sex" : "FEMALE",
        "age" : 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", () => pm.response.to.have.status(201));

      pm.collectionVariables.set("kid1Id", pm.response.json().id);
    language: text/javascript
order: 5000
