$kind: http-request
url: "{{testUrl}}/groups"
method: POST
body:
  type: json
  content: |-
    {
        "name" : "Group1",
        "age" : 2,
        "educatorId" : "{{educatorId}}",
        "assistantId" : "{{assistantId}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", () => pm.response.to.have.status(201));

      pm.collectionVariables.set("group1Id", pm.response.json().id);
    language: text/javascript
order: 6000
