$kind: http-request
url: "{{testUrl}}/rooms"
method: POST
body:
  type: json
  content: |-
    {
        "name" : "Кімната 1"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201", () => pm.response.to.have.status(201));

      pm.collectionVariables.set("roomId", pm.response.json().id);
    language: text/javascript
order: 1000
